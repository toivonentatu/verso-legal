<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verso - Sähköposti vahvistettu</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f2f0e8;
        color: #273019;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
      }

      .card {
        width: min(560px, 100%);
        background: #fffdf7;
        border: 1px solid #dad6c8;
        border-radius: 16px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        padding: 28px 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.6rem;
        line-height: 1.2;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.55;
      }

      .actions {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        border-radius: 10px;
        padding: 11px 14px;
        font-weight: 600;
      }

      .button-primary {
        background: #6e8c4f;
        color: #ffffff;
      }

      .button-secondary {
        background: #ece8db;
        color: #273019;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Sähköposti vahvistettu</h1>
      <p>Tunnus on nyt vahvistettu onnistuneesti.</p>
      <p>Voit jatkaa kirjautumalla Verso-sovellukseen.</p>
      <div class="actions">
        <a class="button button-primary" href="perhehubi://sign-in">Avaa Verso</a>
        <a class="button button-secondary" href="https://toivonentatu.github.io/verso-legal/">Avaa etusivu</a>
      </div>
    </main>
  </body>
</html>
